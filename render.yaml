# Render Blueprint — Reliyo API staging (B5)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: reliyo-api-staging
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build && npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: LOG_FORMAT
        value: json
      - key: API_PREFIX
        value: api/v1
      - key: PAYMENT_MODE
        value: live
      - key: PAYMENT_PSP
        value: razorpay
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: OTP_PROVIDER
        value: dev
      - key: OTP_DEV_FIXED_CODE
        sync: false
      - key: INACTIVITY_JOB_ENABLED
        value: "true"
      - key: WEBHOOK_RETRY_JOB_ENABLED
        value: "true"
